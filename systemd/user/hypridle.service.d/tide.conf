# hypridle counts as started only once it owns org.freedesktop.ScreenSaver:
# Chrome uses the D-Bus inhibitor only if that name is already owned, so an
# app started earlier would silently lose its inhibits (SPEC.md §5.4).
# tide.service Wants= hypridle, so nothing needs to enable it. Distro
# packages enable it anyway, for every session, so it runs only in tide's:
# under Plasma it's skipped, not failed, and Plasma keeps the ScreenSaver name.
#
# A hypridle that keeps failing, by crashing or by never claiming the name,
# stops being restarted after eight starts in 90 s (a start that times out
# takes 10 s), and swayidle takes over the locking
# (tide-idle-fallback.service). The packaged unit restarts it on failure
# with systemd's default limit, five in 10 s, which a timeout never reaches.
#
# The shell is ordered after hypridle, so it waits for hypridle's start job.
# With RestartMode=direct, below, a start that fails goes straight back to
# starting, and that job stays until hypridle is up or the start limit
# ends the restarts: eight timeouts, 80 s, with no bar. So the job itself
# is given just over one start's timeout. Cutting it short leaves the unit
# as it is (systemd.unit(5)): hypridle goes on restarting, and still falls
# back to swayidle at the limit, while the shell starts without it.
[Unit]
OnFailure=tide-idle-fallback.service
StartLimitIntervalSec=90
StartLimitBurst=8
JobRunningTimeoutSec=11

[Service]
# A restart goes straight back to starting, so one crash that the next
# start recovers from doesn't start the fallback (systemd 254 or later).
RestartMode=direct
ExecCondition=/bin/sh -c 'case ":$${XDG_CURRENT_DESKTOP}:" in *:tide:*) ;; *) exit 1 ;; esac'
Type=dbus
BusName=org.freedesktop.ScreenSaver
# Fail fast if it never claims the name, rather than systemd's 90 s default.
# JobRunningTimeoutSec=, above, is what lets the shell start without it.
TimeoutStartSec=10
# As tide.service: graphical-session.target stays active until this has
# stopped, and the next login waits on that, so it gets 5 s, not 90.
TimeoutStopSec=5
# Your hypridle config, or tide's, which `make install` puts beside it as
# tide-hypridle.conf, where its `source = tide-idle.conf` still finds the
# Idle page's settings. hypridle aborts without one, and yours can be missing,
# as when a config repo drops the copy it linked before tide's installer
# has put one in (SPEC.md §10).
ExecStart=
ExecStart=/bin/sh -c 'c=$${XDG_CONFIG_HOME:-$$HOME/.config}/hypr/hypridle.conf; test -e "$$c" || c=$${XDG_CONFIG_HOME:-$$HOME/.config}/hypr/tide-hypridle.conf; exec hypridle --config "$$c"'
