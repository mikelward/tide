# hypridle counts as started only once it owns org.freedesktop.ScreenSaver:
# Chrome uses the D-Bus inhibitor only if that name is already owned, so an
# app started earlier would silently lose its inhibits (SPEC.md §5.4).
# tide.service Wants= hypridle, so nothing needs to enable it. Distro
# packages enable it anyway, for every session, so it runs only in tide's:
# under Plasma it's skipped, not failed, and Plasma keeps the ScreenSaver name.
[Service]
ExecCondition=/bin/sh -c 'case ":$${XDG_CURRENT_DESKTOP}:" in *:tide:*) ;; *) exit 1 ;; esac'
Type=dbus
BusName=org.freedesktop.ScreenSaver
# Fail fast if it never claims the name, rather than systemd's 90 s default,
# so the shell starts without it.
TimeoutStartSec=10
# Your hypridle config, or tide's, which `make install` puts beside it as
# tide-hypridle.conf, where its `source = tide-idle.conf` still finds the
# Idle page's settings. hypridle aborts without one, and yours can be missing,
# as when a config repo drops the copy it linked before tide's installer
# has put one in (SPEC.md §10).
ExecStart=
ExecStart=/bin/sh -c 'c=$${XDG_CONFIG_HOME:-$$HOME/.config}/hypr/hypridle.conf; test -e "$$c" || c=$${XDG_CONFIG_HOME:-$$HOME/.config}/hypr/tide-hypridle.conf; exec hypridle --config "$$c"'
