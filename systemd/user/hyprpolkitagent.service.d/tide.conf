# hyprpolkitagent's package enables its unit for every graphical session.
# In tide's sessions, Hyprland's and tidewm's, tide.service's shell runs the
# polkit agent itself (SPEC.md §5.2), and polkit takes only one per session:
# the unit, started first, would keep tide's out, and `tide doctor` would
# report it. So it's skipped there, not failed. A plain Hyprland login, which
# has no tide shell, keeps it.
[Service]
ExecCondition=/bin/sh -c 'case ":$${XDG_CURRENT_DESKTOP}:" in *:tide:*) exit 1 ;; esac'
