# tide's hyprlock config, for the lock's fallback (SPEC.md §10): what
# hyprlock reads when you have no ~/.config/hypr/hyprlock.conf of your own.
# `make install` puts it at ~/.config/hypr/tide-hyprlock.conf, and
# tide-lock-fallback.service passes it. hyprlock 0.9 aborts without a
# config, and a lock that can't start leaves the session unlocked.
#
# A solid background, as no wallpaper file is sure to be there; the host's
# short name, so it's clear which machine is locked (R21); the time and
# date; and the password field.

background {
    monitor =
    color = rgba(2e3440ff)
}

# No grace period, as tide's lock has none; hyprlock 0.9.0 replaced
# general:grace with a --grace flag.
general {
    hide_cursor = true
    ignore_empty_input = true
}

# Each keystroke's dot and the lock itself appear at once.
animations {
    enabled = false
}

# uname -n, cut at the first dot: hostname -s isn't on every system.
label {
    monitor =
    text = cmd[update:3600000] uname -n | cut -d. -f1
    color = rgba(d8dee9ff)
    font_size = 28
    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(eceff4ff)
    font_size = 96
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(d8dee9ff)
    font_size = 22
    position = 0, 40
    halign = center
    valign = center
}

# White while the password is checked, red when it's wrong: hyprlock's
# own green while checking read as the error.
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(88c0d0ff)
    check_color = rgba(eceff4ff)
    fail_color = rgba(bf616aff)
    inner_color = rgba(2e3440ff)
    font_color = rgba(eceff4ff)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    fail_text = <i>Wrong ($ATTEMPTS)</i>
    position = 0, -60
    halign = center
    valign = center
}
