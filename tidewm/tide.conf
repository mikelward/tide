# tide's config for tidewm (SPEC.md §5.3), the tide (tidewm) session's
# compositor, in sway's syntax (tidewm's docs/config.md). `make install`
# puts it in ~/.config/tidewm/tide.conf, and tide-tidewm runs tidewm with
# it when you have no ~/.config/tidewm/config of your own. Yours can
# `include tide.conf`, then change what it likes: a later binding of the
# same keys replaces tide's, and a later input block's settings win. End
# yours with `include tide-*.conf` too, so tide's settings pages still win.
#
# The keys follow SPEC.md §6.6 as hypr/hyprland.lua binds them. What tidewm
# can't do yet is left out.
#
# A binding tide's Keyboard shortcuts can give other keys (SPEC.md §16)
# has a --name, the name hyprland.lua gives it, so your keys in keys.json
# serve both. The page writes them to tide-keys.conf as rebind lines, which
# the include at the end reads. The rest keep their keys, as hyprland.lua's
# fixed ones: the mouse, the media and brightness keys, Super+0…9, the
# Super tap, a pinned window's app keys and resize mode's.

set $mod Mod4

# tide's look and focus rules (SPEC.md §6.2, §14), as tide's
# Hyprland config sets them. A lone window's widths are tidewm's own,
# tide's, unless the Layouts page sets them in tide-layouts.conf: lines
# here would add to its, not give way.
focus_guard enable
dim_inactive 0.07
# No borders: dimming shows which window is focused.
default_border none

# X11 apps are sharp at a fractional scale (SPEC.md §17): drawn in the
# output's own pixels, unscaled, so one that scales itself is the right
# size and one that doesn't is small.
xwayland_scaling disable

# A US layout, as hyprland.lua's INPUT; your own config's input block can
# change it, and tide's Keyboard page does (tide-input.conf, below).
input type:keyboard {
    xkb_layout us
    repeat_delay 600
    repeat_rate 25
}
# Every mouse at Hyprland's speed, right-handed, as hyprland.lua's. tidewm's
# pointer is anything that can't tap, so tide's apply-input.sh gives a
# laptop's pointing stick and its touchpad's -mouse node the touchpad's
# settings (in tide-devices.conf, included below).
input type:pointer {
    accel_profile adaptive
    pointer_accel 1
    natural_scroll disabled
}
input type:touchpad {
    natural_scroll enabled
    tap enabled
    dwt enabled
}

# A laptop's panel goes off while its lid is closed, and its windows move
# to the other monitors. With none, tide's Power page's Lock locks then, as
# hyprland.lua's lid does (tide lid-closed, SPEC.md §16).
bindswitch --desc "Lid closed: turn the panel off" lid:on output eDP-1 disable; exec tide lid-closed
bindswitch --desc "Lid opened: turn the panel on" --locked lid:off output eDP-1 enable

# Apps, each through `tide launch`, which grants its first window focus
# (SPEC.md §14.3); --app names the window's app ID, or any app's.
bindsym --desc "Terminal" --name=terminal $mod+t exec tide launch --app '*' -- xdg-terminal-exec
bindsym --desc "Files" --name=files $mod+e exec tide launch --app '*' -- xdg-open ~
bindsym --desc "Calculator" XF86Calculator exec tide launch --app org.gnome.Calculator -- gnome-calculator

# tide's shell: the launcher, on Super+Space and a tap of Super, the
# notification center, the picker's tabs, keep awake and presenter mode;
# the name prompt (SPEC.md §6.5), to go to a workspace, or move the
# focused window there; the switcher's Attention tab (§8.1, §14.3); and
# minimizing (§6.7), which the shell's tray brings back.
bindsym --desc "Launcher" --name=launcher $mod+space exec qs -c tide ipc call launcher toggle
bindsym --desc "Launcher" --release Super_L exec qs -c tide ipc call launcher toggle
bindsym --desc "Notification center" --name=notifications $mod+Shift+n exec qs -c tide ipc call notifications toggle
bindsym --desc "Clipboard and characters" --name=clipboard $mod+v exec qs -c tide ipc call picker toggle clipboard
bindsym --desc "Snippets and passwords" --name=fill $mod+Shift+v exec qs -c tide ipc call picker toggle fill
bindsym --desc "Emoji and characters" --name=characters $mod+semicolon exec qs -c tide ipc call picker toggle characters
bindsym --desc "Keep awake" --name=keep_awake $mod+s exec qs -c tide ipc call keepawake toggle
bindsym --desc "Presenter mode" --name=presenter $mod+p exec qs -c tide ipc call presenter toggle
bindsym --desc "Go to a workspace" --name=go_to_workspace $mod+Return exec qs -c tide ipc call prompt go
bindsym --desc "Move the window to a workspace" --name=move_to_workspace $mod+Shift+Return exec qs -c tide ipc call prompt move
bindsym --desc "The windows that want attention" --name=attention $mod+a exec qs -c tide ipc call switcher toggle attention
bindsym --desc "Minimize the window" --name=minimize $mod+z exec qs -c tide ipc call windows minimize

# The next keyboard layout, on the lock screen too.
bindsym --desc "Next keyboard layout" --name=next_keyboard_layout --locked $mod+Alt+space input type:keyboard xkb_switch_layout next

# The session. kill leaves a window pinned where it is open, as tide's
# shell has tidewm keep it open (SPEC.md §6.5), and so do the app's own
# close and quit keys there: bound --kept-open, every other window gets them.
bindsym --desc "Close the window, unless it's pinned" --name=close $mod+BackSpace kill
bindsym --desc "The app's own, unless its window is pinned" --kept-open Ctrl+w kill
bindsym --desc "The app's own, unless its window is pinned" --kept-open Ctrl+Shift+w kill
bindsym --desc "The app's own, unless its window is pinned" --kept-open Ctrl+q kill
bindsym --desc "The app's own, unless its window is pinned" --kept-open Alt+F4 kill
# The lock, as Hyprland's session binds it (SPEC.md §10): `tide lock` goes
# through logind where hypridle or swayidle is running to answer it, and
# starts the lock itself where neither is, or the key would do nothing.
bindsym --desc "Lock" --name=lock $mod+l exec tide lock || loginctl lock-session
# Reloads this config, as Hyprland's session does (SPEC.md §6.6): `tide
# reload` also starts tide's shell if it isn't running, and says what
# failed, as tidewm's errors.
bindsym --desc "Reload the config" --name=reload $mod+Ctrl+r exec tide reload
bindsym --desc "Quit Hyprland" --name=quit $mod+Shift+e exit

# Layouts (SPEC.md §6.1).
bindsym --desc "Monocle" --name=monocle $mod+grave layout monocle
bindsym --desc "Monocle" --name=monocle $mod+o layout monocle
bindsym --desc "Next layout" --name=next_layout $mod+period layout next
bindsym --desc "Previous layout" --name=previous_layout $mod+comma layout prev
bindsym --desc "Grow the master" --name=grow_master $mod+backslash mfact +0.05
bindsym --desc "Shrink the master" --name=shrink_master $mod+slash mfact -0.05
bindsym --desc "Add a master" --name=add_master $mod+equal nmaster +1
bindsym --desc "Remove a master" --name=remove_master $mod+minus nmaster -1
bindsym --desc "Swap with the master" --name=swap_master Alt+Tab zoom
bindsym --desc "Focus down the stack" --name=focus_down $mod+j focus next
bindsym --desc "Focus up the stack" --name=focus_up $mod+k focus prev
bindsym --desc "Move down the stack" --name=move_down $mod+Shift+j movestack next
bindsym --desc "Move up the stack" --name=move_up $mod+Shift+k movestack prev
bindsym --desc "Focus the window to the left" --name=focus_left $mod+Left focus left
bindsym --desc "Focus the window to the right" --name=focus_right $mod+Right focus right
bindsym --desc "Move the window left" --name=move_left $mod+Shift+Left move left
bindsym --desc "Move the window right" --name=move_right $mod+Shift+Right move right
bindsym --desc "Maximize" --name=maximize $mod+Up maximize toggle
bindsym --desc "Fullscreen" --name=fullscreen $mod+Shift+Up fullscreen toggle
bindsym --desc "Restore" --name=restore $mod+Down fullscreen disable; maximize disable
bindsym --desc "Float or tile" --name=float $mod+Shift+f floating toggle
bindsym --desc "Float or tile" --name=float $mod+Insert floating toggle

# The mouse, as hyprland.lua's: Super and the left button drag a window,
# which floats a tile, Super and the right one resize it, and Super and
# the middle one maximize it, or put it back.
floating_modifier $mod normal
bindsym --desc "Maximize" --whole-window $mod+button2 maximize toggle

# Workspaces (SPEC.md §6.6): Super+1 to 9 go to the bar's nth, and
# Super+0 to its last, and Shift sends the focused window there; Super+Home
# goes home; Super+Tab goes home, and from home back to the last other
# workspace; and Super+End goes to the last other than home and this one.
# tidewm knows neither the bar's order nor home, so tide's shell does them,
# and without it a notification says so.
set $workspaces qs -c tide ipc call workspaces
set $no_shell notify-send -a tide 'No workspace keys' 'Super with a number, Home, Tab or End needs the tide shell, which is not running.'
bindsym --desc "Workspace 1 on the bar" $mod+1 exec $workspaces go 1 || $no_shell
bindsym --desc "Workspace 2 on the bar" $mod+2 exec $workspaces go 2 || $no_shell
bindsym --desc "Workspace 3 on the bar" $mod+3 exec $workspaces go 3 || $no_shell
bindsym --desc "Workspace 4 on the bar" $mod+4 exec $workspaces go 4 || $no_shell
bindsym --desc "Workspace 5 on the bar" $mod+5 exec $workspaces go 5 || $no_shell
bindsym --desc "Workspace 6 on the bar" $mod+6 exec $workspaces go 6 || $no_shell
bindsym --desc "Workspace 7 on the bar" $mod+7 exec $workspaces go 7 || $no_shell
bindsym --desc "Workspace 8 on the bar" $mod+8 exec $workspaces go 8 || $no_shell
bindsym --desc "Workspace 9 on the bar" $mod+9 exec $workspaces go 9 || $no_shell
bindsym --desc "The last workspace on the bar" $mod+0 exec $workspaces go 0 || $no_shell
bindsym --desc "Send the window to workspace 1 on the bar" $mod+Shift+1 exec $workspaces send 1 || $no_shell
bindsym --desc "Send the window to workspace 2 on the bar" $mod+Shift+2 exec $workspaces send 2 || $no_shell
bindsym --desc "Send the window to workspace 3 on the bar" $mod+Shift+3 exec $workspaces send 3 || $no_shell
bindsym --desc "Send the window to workspace 4 on the bar" $mod+Shift+4 exec $workspaces send 4 || $no_shell
bindsym --desc "Send the window to workspace 5 on the bar" $mod+Shift+5 exec $workspaces send 5 || $no_shell
bindsym --desc "Send the window to workspace 6 on the bar" $mod+Shift+6 exec $workspaces send 6 || $no_shell
bindsym --desc "Send the window to workspace 7 on the bar" $mod+Shift+7 exec $workspaces send 7 || $no_shell
bindsym --desc "Send the window to workspace 8 on the bar" $mod+Shift+8 exec $workspaces send 8 || $no_shell
bindsym --desc "Send the window to workspace 9 on the bar" $mod+Shift+9 exec $workspaces send 9 || $no_shell
bindsym --desc "Send the window to the last workspace on the bar" $mod+Shift+0 exec $workspaces send 0 || $no_shell
bindsym --desc "Home workspace" --name=home $mod+Home exec $workspaces home || $no_shell
bindsym --desc "Home, or back to the last workspace" --name=home_or_back $mod+Tab exec $workspaces homeOrBack || $no_shell
bindsym --desc "The last workspace other than home" --name=last_other_workspace $mod+End exec $workspaces lastOther || $no_shell
bindsym --desc "Previous workspace" --name=previous_workspace $mod+Page_Up workspace prev
bindsym --desc "Next workspace" --name=next_workspace $mod+Page_Down workspace next
bindsym --desc "Move the window to the previous workspace" --name=move_to_previous_workspace $mod+Shift+Page_Up move container to workspace prev
bindsym --desc "Move the window to the next workspace" --name=move_to_next_workspace $mod+Shift+Page_Down move container to workspace next

# Screenshots (SPEC.md §13) to the clipboard: the screen, the focused
# window (Alt), from its place in tidewm's tree, or a region (Shift or
# Super), as hyprland.lua's without its `screenshot` option. Esc on a
# region cancels quietly; a failure says so.
set $shot_failed notify-send -a tide 'No screenshot' 'grim or wl-copy failed.'
bindsym --desc "Screenshot" --name=screenshot Print exec grim - | wl-copy -t image/png || $shot_failed
bindsym --desc "Screenshot of the window" --name=screenshot_window Alt+Print exec r=$(tide-msg --type get_tree | jq -r '[.. | objects | select(.focused == true and .rect != null)][0].rect | "\(.x),\(.y) \(.width)x\(.height)"') && grim -g "$r" - | wl-copy -t image/png || $shot_failed
bindsym --desc "Screenshot of a region" --name=screenshot_region Shift+Print exec g=$(slurp) || exit 0; grim -g "$g" - | wl-copy -t image/png || $shot_failed
bindsym --desc "Screenshot of a region" --name=screenshot_region $mod+Print exec g=$(slurp) || exit 0; grim -g "$g" - | wl-copy -t image/png || $shot_failed

# Volume, the microphone, brightness and media, on the lock screen too.
bindsym --desc "Volume up" --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --desc "Volume down" --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --desc "Mute" --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --desc "Mute the microphone" --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym --desc "Mute the microphone" --name=mute_microphone --locked $mod+Shift+m exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym --desc "Brightness up" --locked XF86MonBrightnessUp exec tide brightness 5%+
bindsym --desc "Brightness down" --locked XF86MonBrightnessDown exec tide brightness 5%-
bindsym --desc "Play or pause" --locked XF86AudioPlay exec playerctl play-pause
bindsym --desc "Play or pause" --locked XF86AudioPause exec playerctl play-pause
bindsym --desc "Next track" --locked XF86AudioNext exec playerctl next
bindsym --desc "Previous track" --locked XF86AudioPrev exec playerctl previous

# Resize mode, as hyprland.lua's: h/j/k/l or the arrows, Esc or Return to
# leave. A floating window's right or bottom edge moves 40 pixels; a
# tile's column grows or shrinks by 5% of the window area.
bindsym --desc "Resize mode" --name=resize_mode $mod+Shift+r mode "resize"
mode "resize" {
    bindsym --desc "Narrower" h resize shrink right 40 px or 5 ppt
    bindsym --desc "Wider" l resize grow right 40 px or 5 ppt
    bindsym --desc "Shorter" k resize shrink down 40 px
    bindsym --desc "Taller" j resize grow down 40 px
    bindsym --desc "Narrower" Left resize shrink right 40 px or 5 ppt
    bindsym --desc "Wider" Right resize grow right 40 px or 5 ppt
    bindsym --desc "Shorter" Up resize shrink down 40 px
    bindsym --desc "Taller" Down resize grow down 40 px
    bindsym --desc "Leave resize mode" Escape mode default
    bindsym --desc "Leave resize mode" Return mode default
}

# tide's Keyboard shortcuts record a shortcut's new keys in this mode,
# where no other binding takes them (SPEC.md §16). Esc leaves it,
# which tide takes as a cancel; it's also the way out should tide go away
# mid-recording.
mode "tide-keys" {
    bindsym --desc "Stop recording a shortcut" Escape mode default
}

# The settings tide's shell writes (SPEC.md §16), as hyprland.lua reads
# tide-*.lua: the Mouse, Touchpad and Keyboard pages' tide-input.conf, the
# Keyboard shortcuts' tide-keys.conf, and the pages to come. Last, so they
# win over the lines above. One the shell hasn't written yet includes
# nothing.
include tide-*.conf

# The arrangement Displays' Arrange displays saves: nwg-displays takes
# tidewm for sway and writes sway's file. After tide-outputs.conf, so it
# wins. Before it's saved, it includes nothing.
include ~/.config/sway/outputs
