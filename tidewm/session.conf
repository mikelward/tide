# The tide (tidewm) and tide (tidesway) sessions' config (SPEC.md §6.8):
# tide's, then yours, then the settings pages', then the display
# arrangement, each winning where it says the same as one before.
# `make install` puts it beside tide.conf, and tide-tidewm runs the
# compositor with it. Change your ~/.config/tidewm/config, not this file.
#
# tide's keys, input defaults and look
include tide.conf
# Yours, saying only what it changes; one that isn't there includes nothing
include config
# The settings tide's shell writes (SPEC.md §16): the Mouse, Touchpad and
# Keyboard pages' tide-input.conf, the Keyboard shortcuts' tide-keys.conf
# and the rest. Each holds only what you changed on its page, so it wins
# over yours for those alone. One the shell hasn't written includes nothing.
include tide-*.conf
# The arrangement Displays' Arrange displays saves: nwg-displays takes
# tidewm for sway and writes sway's file. After tide-outputs.conf, so it
# wins. Before it's saved, it includes nothing.
include ~/.config/sway/outputs
