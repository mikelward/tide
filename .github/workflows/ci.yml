name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number }}

  # Tests run on Lua 5.4, which Ubuntu packages; Hyprland embeds 5.5 and the
  # layout uses nothing that differs between them.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Lua and qmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 qt6-declarative-dev-tools
      # The oldest Go go.mod allows, so a newer-only API fails here and not
      # on a distro's Go.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test

  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, test]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number }}
          classify-result: ${{ needs.classify.result }}
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: test=${{ needs.test.result }}
