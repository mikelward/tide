<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tide's boot splash images</title>
<!-- What plymouth/render.js draws each of the theme's images from: one
     element per image, its id the file's name. Colors are tide's dark
     palette (theme/palette.json): fg, fg-dim, surface, urgent, accent-bg. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=block">
<style>
  body { margin: 0; background: transparent; font-family: 'Inter', sans-serif; }
  .img { display: inline-flex; align-items: center; margin: 4px; }
  #watermark { gap: 12px; padding: 2px 4px; }
  #watermark svg { width: 48px; height: 48px; }
  #watermark span { font-size: 38px; font-weight: 600; letter-spacing: -.02em; color: #ededf1; line-height: 1; padding-bottom: 4px; }
  #entry { width: 214px; height: 34px; box-sizing: border-box; border-radius: 8px; background: #2a2a2f; box-shadow: inset 0 0 0 1px rgba(255,255,255,.09); }
  /* Plymouth puts bullets edge to edge, so the bullet's own width spaces them. */
  #bullet { width: 13px; height: 13px; justify-content: center; }
  #bullet i { width: 7px; height: 7px; border-radius: 50%; background: #ededf1; }
  #lock { width: 28px; height: 34px; justify-content: center; }
  #lock svg, #keyboard svg, #capslock svg { width: 16px; height: 16px; }
  #keyboard { width: 18px; height: 18px; justify-content: center; }
  #capslock { gap: 5px; padding: 0 0 0 14px; height: 18px; font-size: 13px; font-weight: 600; color: #f8e45c; }
  .throbber { width: 30px; height: 30px; }
</style>
</head>
<body>
<div class="img" id="watermark">
  <svg viewBox="0 0 16 16" fill="none" stroke="#3584e4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1.75 6.25q2.083-2 4.167 0t4.166 0t4.167 0"/><path d="M1.75 10.75q2.083-2 4.167 0t4.166 0t4.167 0"/></svg>
  <span>tide</span>
</div>
<div class="img" id="entry"></div>
<div class="img" id="bullet"><i></i></div>
<div class="img" id="lock"><svg viewBox="0 0 16 16" fill="none" stroke="#9a9aa6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.25" y="7.25" width="9.5" height="6.5" rx="1.5"/><path d="M5.25 7.25V5a2.75 2.75 0 0 1 5.5 0v2.25"/></svg></div>
<div class="img" id="keyboard"><svg viewBox="0 0 16 16" fill="none" stroke="#9a9aa6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="1.75" y="4.25" width="12.5" height="7.5" rx="1.5"/><path d="M4.5 6.75h.01M7 6.75h.01M9.5 6.75h.01M12 6.75h.01M5.5 9.25h5"/></svg></div>
<div class="img" id="capslock"><svg viewBox="0 0 16 16" fill="none" stroke="#f8e45c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.25 3 7.5h2.75v3h4.5v-3H13z"/><path d="M5.75 13.25h4.5"/></svg>Caps Lock is on</div>
<div id="throbbers"></div>
<script>
  // 60 frames, 12° apart: Plymouth plays a throbber's frames over 2 s, so
  // two turns make one a second.
  const out = document.getElementById("throbbers");
  for (let i = 1; i <= 60; i++) {
    const id = "throbber-" + String(i).padStart(4, "0");
    out.insertAdjacentHTML("beforeend",
      `<div class="img throbber" id="${id}"><svg viewBox="0 0 30 30" width="30" height="30" fill="none" stroke-width="3" stroke-linecap="round">` +
      `<circle cx="15" cy="15" r="12" stroke="#2a2a2f"/>` +
      `<path d="M15 3 A12 12 0 0 1 27 15" stroke="#9a9aa6" transform="rotate(${(i - 1) * 12} 15 15)"/></svg></div>`);
  }
</script>
</body>
</html>
